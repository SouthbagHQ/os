name: iso

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "src/**"
      - "index.html"
      - ".github/workflows/iso.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - name: Build the shell for the device
        run: bun run build:device

      - name: Build the ISO
        run: ./image/build.sh

      - name: Verify the image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xorriso squashfs-tools

          # Structural checks. Unlike the boot test these are reliable on a
          # runner with no KVM, and they catch the failure most likely to pass
          # unnoticed: an image that boots fine and has no shell in it.
          listing=$(xorriso -indev out/southbag-os.iso -find / 2>/dev/null)

          fail=0
          for path in /EFI /live/filesystem.squashfs /install; do
            if echo "$listing" | grep -qF "$path"; then
              echo "ok      $path"
            else
              echo "MISSING $path"
              fail=1
            fi
          done

          xorriso -osirrox on -indev out/southbag-os.iso \
            -extract /live/filesystem.squashfs squashfs.img 2>/dev/null

          for path in \
            usr/share/southbag-shell/index.html \
            usr/local/bin/southbag-shell \
            usr/local/bin/southbag-session \
            usr/local/bin/southbag-ready \
            etc/labwc/rc.xml \
            etc/systemd/system/southbag-shell-assets.service \
            usr/bin/cog \
            usr/bin/labwc
          do
            if unsquashfs -l squashfs.img "/$path" 2>/dev/null | grep -q "$path"; then
              echo "ok      $path"
            else
              echo "MISSING $path"
              fail=1
            fi
          done

          # The GRUB hand-off fix must be present in the built image. A hook
          # that quietly does nothing is how the boot hang survived a build.
          xorriso -osirrox on -indev out/southbag-os.iso \
            -extract /boot/grub/grub.cfg grub.cfg 2>/dev/null
          if grep -q "^set timeout=" grub.cfg && grep -q "terminal_output --append serial" grub.cfg; then
            echo "ok      grub.cfg has a timeout and a serial console"
          else
            echo "MISSING grub.cfg boot timeout / serial console"
            fail=1
          fi

          rm -f squashfs.img grub.cfg
          [ "$fail" -eq 0 ] || { echo "::error::Image is missing required files."; exit 1; }

      # Not blocking. GitHub's standard runners have no KVM, and under pure
      # emulation this does not reach userspace in any workable time. It is
      # kept for the serial log it produces; real hardware is the real test.
      - name: Smoke boot it
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 ovmf
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd

          # Without KVM this is pure emulation and does not reach userspace in
          # any reasonable time, which is exactly how the first run failed.
          if [ -w /dev/kvm ]; then
            echo "KVM available."
            accel="-accel kvm -cpu host"
          else
            echo "::warning::No KVM. Falling back to emulation, which is slow."
            accel="-accel tcg -cpu max"
          fi

          # UEFI, 2GB of RAM: the memory profile the OS is meant to run in.
          timeout 840 qemu-system-x86_64 \
            $accel \
            -machine q35 -m 2048 -smp 2 -nographic -no-reboot \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -device virtio-gpu-pci \
            -cdrom out/southbag-os.iso \
            -boot d \
            -serial file:serial.log \
            -monitor none -display none || true

          echo "--- serial tail ---"
          tail -80 serial.log || true

          # SOUTHBAG-OS-READY is only printed once the assets are served,
          # labwc is up and cog is running. Anything less is a broken image.
          grep -o "SOUTHBAG-OS-[A-Z-]*" serial.log | sort -u || true

          if grep -q "SOUTHBAG-OS-READY" serial.log; then
            echo "Booted to a running shell."
          else
            echo "::error::ISO did not reach a running shell. See serial.log."
            exit 1
          fi

      - name: Report size
        if: always()
        run: ls -lh out/southbag-os.iso || true

      # Always: a failed boot is exactly when the ISO and the log are wanted.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southbag-os-iso
          path: |
            out/southbag-os.iso
            serial.log
          if-no-files-found: error
