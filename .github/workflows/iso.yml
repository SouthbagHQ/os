name: iso

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "src/**"
      - "index.html"
      - ".github/workflows/iso.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the verified main-branch ISO to a new GitHub Release'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'New version tag, for example v0.1.0 (required for publishing)'
        type: string
        required: false
        default: ''
      dormant_ci1:
        description: 'Include the separately qualified exact dormant ci1 package; no activation'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      boot_ready: ${{ steps.smoke.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Validate release request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DORMANT: ${{ inputs.dormant_ci1 }}
        run: |
          [ "$GITHUB_REPOSITORY" = 'SouthbagHQ/os' ] && [ "$GITHUB_REF" = 'refs/heads/main' ] || {
            echo '::error::Releases must be built from SouthbagHQ/os main.'; exit 1;
          }
          [ "$DORMANT" = 'false' ] || { echo '::error::Diagnostic worker images are not release images.'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo '::error::Supply a new version tag such as v0.1.0.'; exit 1;
          }

      - run: bun install --frozen-lockfile
      - name: Build the shell for the device
        run: bun run build:device

      - name: Download the exact qualified CI artifact
        if: github.event_name == 'workflow_dispatch' && inputs.dormant_ci1
        uses: actions/download-artifact@v4
        with:
          name: dormant-inject-source-candidate
          repository: SouthbagHQ/os
          run-id: 42316164025
          github-token: ${{ github.token }}
          path: out/inject-input

      - name: Verify and package the exact ci1 diagnostic input
        if: github.event_name == 'workflow_dispatch' && inputs.dormant_ci1
        run: |
          # Builder verifies exact selected binary/source, never executes it.
          bash packaging/build-inject-deb.sh out/inject-input/espanso-candidate out/inject-input/source.tar.gz out/inject-ci1 ci-candidate
          # Stager independently verifies the guest-tested package envelope.
          bash packaging/stage-inject-image.sh out/inject-ci1/southbag-inject_2.4.1+southbag.1.minimal.ci1_amd64.deb out/inject-input/source.tar.gz ci1
          echo "SOUTHBAG_INJECT_DEB=$GITHUB_WORKSPACE/out/inject-ci1/southbag-inject_2.4.1+southbag.1.minimal.ci1_amd64.deb" >>"$GITHUB_ENV"
          echo "SOUTHBAG_INJECT_SOURCE=$GITHUB_WORKSPACE/out/inject-input/source.tar.gz" >>"$GITHUB_ENV"
          echo "SOUTHBAG_INJECT_LANE=ci1" >>"$GITHUB_ENV"

      - name: Download immutable hash-pinned kevin-source-candidate inputs
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dormant_ci1) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/kevin-input
          curl --fail --location --retry 3 https://github.com/SouthbagHQ/os/releases/download/worker-input-kevin-ci1/espanso-candidate -o out/kevin-input/espanso-candidate
          curl --fail --location --retry 3 https://github.com/SouthbagHQ/os/releases/download/worker-input-kevin-ci1/source.tar.gz -o out/kevin-input/source.tar.gz
          curl --fail --location --retry 3 https://github.com/SouthbagHQ/os/releases/download/worker-input-kevin-ci1/southbag-inject_2.4.1%2Bsouthbag.2.kevin1.ci1_amd64.deb -o out/kevin-input/southbag-inject_2.4.1+southbag.2.kevin1.ci1_amd64.deb
          echo 'c28046a7573efedc8806e8ea70c60be8df3c4ff52101aa6264f929b4fc046f1d  out/kevin-input/espanso-candidate' | sha256sum --check
          echo '9d00e6cd1b2917c63022664426c8f25e174644711882c1671894a60bb5e4d0d9  out/kevin-input/source.tar.gz' | sha256sum --check
          echo 'e75fe8dba441f1543d618bd541e61eef660b788584f677a8189b74132b01cefe  out/kevin-input/southbag-inject_2.4.1+southbag.2.kevin1.ci1_amd64.deb' | sha256sum --check
          echo "SOUTHBAG_KEVIN_DEB=$GITHUB_WORKSPACE/out/kevin-input/southbag-inject_2.4.1+southbag.2.kevin1.ci1_amd64.deb" >>"$GITHUB_ENV"
          echo "SOUTHBAG_KEVIN_SOURCE=$GITHUB_WORKSPACE/out/kevin-input/source.tar.gz" >>"$GITHUB_ENV"

      - name: Build the ISO
        # bash invocation, not ./: file modes are not guaranteed to
        # survive publication through the web UI.
        run: bash image/build.sh

      - name: Verify the image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xorriso squashfs-tools

          # Structural checks. Unlike the boot test these are reliable on a
          # runner with no KVM, and they catch the failure most likely to pass
          # unnoticed: an image that boots fine and has no shell in it.
          listing=$(xorriso -indev out/southbag-os.iso -find / 2>/dev/null)

          fail=0
          for path in /EFI /live/filesystem.squashfs /install; do
            if echo "$listing" | grep -qF "$path"; then
              echo "ok      $path"
            else
              echo "MISSING $path"
              fail=1
            fi
          done

          xorriso -osirrox on -indev out/southbag-os.iso \
            -extract /live/filesystem.squashfs squashfs.img 2>/dev/null

          for path in \
            usr/share/southbag-shell/index.html \
            usr/local/bin/southbag-shell \
            usr/local/bin/southbag-session \
            usr/local/bin/southbag-ready \
            etc/labwc/rc.xml \
            usr/share/southbag-shell/cgi-bin/launch \
            usr/bin/cog \
            usr/bin/labwc
          do
            if unsquashfs -l squashfs.img "/$path" 2>/dev/null | grep -q "$path"; then
              echo "ok      $path"
            else
              echo "MISSING $path"
              fail=1
            fi
          done

          # The GRUB hand-off fix must be present in the built image. A hook
          # that quietly does nothing is how the boot hang survived a build.
          xorriso -osirrox on -indev out/southbag-os.iso \
            -extract /boot/grub/grub.cfg grub.cfg 2>/dev/null
          if grep -q "^set timeout=" grub.cfg && grep -q "terminal_output --append serial" grub.cfg; then
            echo "ok      grub.cfg has a timeout and a serial console"
          else
            echo "MISSING grub.cfg boot timeout / serial console"
            fail=1
          fi

          rm -f squashfs.img grub.cfg
          [ "$fail" -eq 0 ] || { echo "::error::Image is missing required files."; exit 1; }

      # Artifact builds retain diagnostics on a failed smoke. Release publishing
      # separately requires the positive ready output, so it cannot inherit
      # this continue-on-error behavior. Hardware support needs separate tests.
      - name: Smoke boot it
        id: smoke
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 ovmf
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd

          # Without KVM this is pure emulation and does not reach userspace in
          # any reasonable time, which is exactly how the first run failed.
          if [ -w /dev/kvm ]; then
            echo "KVM available."
            accel="-accel kvm -cpu host"
          else
            echo "::warning::No KVM. Falling back to emulation, which is slow."
            accel="-accel tcg -cpu qemu64"
          fi

          # Use conservative baseline CPU emulation and standard VGA under TCG.
          # CPU max exposed an LLVM renderer crash in CI; this smoke does not
          # certify advanced SIMD or virtio graphics hardware support.
          # UEFI, 2GB of RAM: the memory profile the OS is meant to run in.
          timeout 840 qemu-system-x86_64 \
            $accel \
            -machine q35 -m 2048 -smp 2 -nographic -no-reboot \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -vga std \
            -cdrom out/southbag-os.iso \
            -boot d \
            -serial file:serial.log \
            -monitor none -display none || true

          echo "--- serial tail ---"
          tail -80 serial.log || true

          # SOUTHBAG-OS-READY is only printed once the assets are served,
          # labwc is up and cog is running. Anything less is a broken image.
          grep -o "SOUTHBAG-OS-[A-Z-]*" serial.log | sort -u || true

          # A transient ready marker is not a healthy boot. The full smoke
          # window above must also stay free of renderer/kernel crashes and
          # compositor restarts, or a reboot loop can look like success.
          if grep -Eq 'segfault at|general protection fault|Kernel panic|Oops:' serial.log; then
            echo '::error::Runtime crash detected after boot; refusing release readiness.'
            exit 1
          fi
          if grep -q 'SOUTHBAG-OS-UNSTABLE' serial.log ||
             ! grep -q 'SOUTHBAG-OS-STABLE' serial.log; then
            echo '::error::No sustained healthy compositor/shell interval during smoke.'
            exit 1
          fi
          if grep -q "SOUTHBAG-OS-READY" serial.log; then
            echo "Booted to a running shell without observed runtime crashes."
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::error::ISO did not reach a running shell. See serial.log."
            exit 1
          fi

      - name: Record release checksums and provenance
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && steps.smoke.outputs.ready == 'true'
        run: |
          (cd out && sha256sum southbag-os.iso southbag-inject_*_source.tar.gz >SHA256SUMS)
          printf 'Southbag OS ISO\n\nSource commit: %s\nBuild: %s/%s/actions/runs/%s\n\nUEFI live ISO. This build passed structural verification and booted to the running-shell readiness marker under QEMU. This does not certify physical hardware, sound, camera or backlight support.\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >out/RELEASE.md
          cat >>out/RELEASE.md <<'NOTES'

          Kevin enforcement is enabled in all fields, including passwords: a lowercase kevin sequence becomes Kevin as typed. Enforcement pauses after sign-out or terminal input-device/monitor loss until reboot. Browser v1.1.0 is included.

          Qualification limits: QEMU only, not physical hardware certification. Graphical plain/password/native-lock correction and reset cleanup passed on the qualification ISO. Device-removal testing used a USB tablet and monitor sequence-gap shutdown, not physical keyboard read-EIO. Held Shift was sampled at startup, but no final-image held-modifier pixel claim is made. No signed-in Drive or new Electron-window proof is claimed. Native password tests used a restored local synthetic verifier.
          NOTES

      - name: Report size
        if: always()
        run: ls -lh out/southbag-os.iso || true

      # Always: a failed boot is exactly when the ISO and the log are wanted.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: southbag-os-iso
          path: |
            out/southbag-os.iso
            out/SHA256SUMS
            out/RELEASE.md
            out/southbag-inject_*_source.tar.gz
            out/kevin-input/southbag-inject_*_amd64.deb
            serial.log
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: southbag-os-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Require a verified boot
        env:
          BOOT_READY: ${{ needs.build.outputs.boot_ready }}
        run: |
          [ "$BOOT_READY" = 'true' ] || { echo '::error::No release: ISO did not reach a running shell.'; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: southbag-os-iso
          path: release-input
      - name: Verify and publish a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-input/out
          sha256sum --check SHA256SUMS
          gh --version
          # Never overwrite an existing version or attach a new image to it.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Tag already exists. Select a new version.'; exit 1;
          fi
          # Corresponding source accompanies every distributed worker image.
          shopt -s nullglob
          source_assets=(southbag-inject_*_source.tar.gz)
          [ "${#source_assets[@]}" -gt 0 ] || { echo '::error::Missing corresponding worker source'; exit 1; }
          gh release create "$RELEASE_TAG" southbag-os.iso SHA256SUMS "${source_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Southbag OS $RELEASE_TAG" --notes-file RELEASE.md
