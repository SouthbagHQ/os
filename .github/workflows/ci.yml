name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: python3 tests/broker-ipc.test.py
      - run: python3 tests/worker-provisioning.test.py
      - run: python3 tests/fixture-cleanup.test.py
      # The deadline-driven device-session contract tests exceed bun's 5s
      # default per-test timeout; bunfig has no timeout key (oven-sh/bun#7789),
      # so set it on the command line here.
      - run: python3 scripts/test-child-cleanup.py bun test --timeout 30000
      # Fails the job when a bucket in budget.json is exceeded.
      - run: bun run build
