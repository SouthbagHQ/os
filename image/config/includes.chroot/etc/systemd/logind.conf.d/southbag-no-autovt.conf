[Login]
# A kiosk has one console. labwc/wlroots honor Ctrl+Alt+Fn at the session
# level, below keybinds, so neither the shell nor the lock can intercept the
# VT switch itself. Without this drop-in, logind spawns a getty on the VT
# the keyboard switches to - a login prompt the lock screen never sees.
# With it, switching away yields a console with no getty on it, and
# switching back returns to the still-locked session.
NAutoVTs=0
