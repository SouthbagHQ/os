<html lang="en">

    <meta charset="utf-8" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%BASE_URL%fonts/cormorant-300.woff2"

      rel="preload"

       * Declared here rather than in the bundle so the boot mark can be set

        font-family: "IBM Plex Sans";
        src: url("%BASE_URL%fonts/plex-sans.woff2") format("woff2-variations");
        font-weight: 400 500;
        font-display: block;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("%BASE_URL%fonts/cormorant-300.woff2") format("woff2");
        font-weight: 300;
        font-display: block;
      }
      html {
        background: #050608;
      }
    </style>
